name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run configuration and localization checks
        run: python3 tests/check_project.py

      - name: Select newest installed Xcode (26+)
        run: |
          python3 - <<'PY'
          import glob, plistlib, subprocess
          apps = []
          for path in glob.glob('/Applications/Xcode*.app'):
              with open(path + '/Contents/Info.plist', 'rb') as file:
                  version = plistlib.load(file)['CFBundleShortVersionString']
              try:
                  parts = tuple(int(value) for value in version.split('.'))
              except ValueError:
                  continue
              apps.append((parts, path))
          assert apps, 'No Xcode installed'
          version, path = max(apps)
          assert version >= (26, 0), 'Install Xcode 26 or later on the runner.'
          subprocess.run(['sudo', 'xcode-select', '-s', path + '/Contents/Developer'], check=True)
          PY

      - name: Prepare CI Xcode project
        run: |
          gem install xcodeproj --version 1.27.0 --no-document --user-install
          ruby tests/prepare_ci_project.rb "$RUNNER_TEMP/DSFile-CI"

      - name: Build unsigned Release iphoneos app
        run: >-
          xcodebuild
          -project "$RUNNER_TEMP/DSFile-CI/WQManager.xcodeproj"
          -scheme WQManager
          -configuration Release
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/DSFile-Build"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=""
          DEVELOPMENT_TEAM=""
          build

      - name: Package DSFile.ipa
        run: |
          APP_PATH="$RUNNER_TEMP/DSFile-Build/Build/Products/Release-iphoneos/WQManager.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"
          mkdir -p "$RUNNER_TEMP/out"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$RUNNER_TEMP/out/DSFile-unsigned.ipa" Payload)
          ls -lh "$RUNNER_TEMP/out/DSFile-unsigned.ipa"

      - name: Upload DSFile-unsigned.ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSFile-unsigned-ipa
          path: ${{ runner.temp }}/out/DSFile-unsigned.ipa
          retention-days: 30

      - name: Attach IPA to GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/out/DSFile-unsigned.ipa
